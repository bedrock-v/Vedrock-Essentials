# Vedrock permissions configuration
# Override the default access level for any permission node below.
# Edit it and restart to change who can use a command.
# Values: granted (everyone) | denied (nobody, unless granted per-player in-game) | op (operators only) | not_op (everyone except operators)

# Allows getting the server version
vedrock.cmd.version: granted

# Allows viewing the server's status
vedrock.cmd.status: op

# Allows changing one's own game mode
vedrock.cmd.gamemode.self: op

# Allows changing another player's game mode
vedrock.cmd.gamemode.other: op

# Allows granting/revoking operator status
vedrock.cmd.op: op

# Allows managing the server whitelist
vedrock.cmd.whitelist: op

# Allows killing yourself
vedrock.cmd.kill.self: op

# Allows killing another player
vedrock.cmd.kill.other: op

# Allows teleporting yourself
vedrock.cmd.teleport.self: op

# Allows teleporting another player
vedrock.cmd.teleport.other: op

# Allows clearing your own inventory
vedrock.cmd.clear.self: op

# Allows clearing another player's inventory
vedrock.cmd.clear.other: op

# Allows giving items to players
vedrock.cmd.give: op

# Allows changing the world's difficulty
vedrock.cmd.difficulty: op

# Allows broadcasting a message as the server
vedrock.cmd.say: op

# Allows sending titles to players
vedrock.cmd.title: op

# Allows managing worlds (list/info/create/delete/tp)
vedrock.cmd.world: op

vedrock.cmd.water: op

# Comma-separated default command names to disable entirely (unregistered on startup).
disabled-commands: 
