# Vedrock per-player permission grants
# Applies on top of permissions.yml + ops.txt. use this to give (or take away)
#
# Format: <player-name | xuid:<xuid> | uuid:<uuid>>: <node>, -<node-to-deny>, ...
# A bare node grants it; a "-" prefix explicitly denies it. One line per player.
#
# Examples:
# Steve: vedrock.cmd.status, vedrock.cmd.gamemode.other
# xuid:2535413414841234: -vedrock.cmd.version
#
# Known permission nodes:
#   vedrock.cmd.version - Allows getting the server version
#   vedrock.cmd.status - Allows viewing the server's status
#   vedrock.cmd.gamemode.self - Allows changing one's own game mode
#   vedrock.cmd.gamemode.other - Allows changing another player's game mode
#   vedrock.cmd.op - Allows granting/revoking operator status
#   vedrock.cmd.whitelist - Allows managing the server whitelist
#   vedrock.cmd.kill.self - Allows killing yourself
#   vedrock.cmd.kill.other - Allows killing another player
#   vedrock.cmd.teleport.self - Allows teleporting yourself
#   vedrock.cmd.teleport.other - Allows teleporting another player
#   vedrock.cmd.clear.self - Allows clearing your own inventory
#   vedrock.cmd.clear.other - Allows clearing another player's inventory
#   vedrock.cmd.give - Allows giving items to players
#   vedrock.cmd.difficulty - Allows changing the world's difficulty
#   vedrock.cmd.say - Allows broadcasting a message as the server
#   vedrock.cmd.title - Allows sending titles to players
#   vedrock.cmd.world - Allows managing worlds (list/info/create/delete/tp)
#   vedrock.cmd.water
